<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#920000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23920000'/%3E%3Cpath d='M9 25V8h10v17M19 13h4v12M12 12h4M12 16h4M12 20h4' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Sistema Municipal – Interfaz de referencia</title>
<style>
:root{
  --muni:#920000;--muni-dark:#6f0000;--muni-tint:#fbeaea;
  --ink:#1f2328;--muted:#5b6370;--line:#dde1e6;--bg:#f5f6f8;
  --ok:#17663b;--ok-bg:#e3f3ea;--warn:#7a4f00;--warn-bg:#fcf0d0;--bad:#9b1c1c;--bad-bg:#fbe4e4;
  --info:#1b4f8a;--info-bg:#e4eef9;--off:#4b5260;--off-bg:#eceef1;
  --header-h:60px;--side-w:236px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 "Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.2;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--muni)}
:focus-visible{outline:3px solid #1b4f8a;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;color:var(--ink);padding:8px 12px;border-radius:6px;z-index:200}
.skip:focus{left:8px}

/* Cabecera */
.top{height:var(--header-h);background:var(--muni);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:30}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand small{font-weight:400;opacity:.9;font-size:16px;letter-spacing:0}
.ctx{flex:1;display:flex;justify-content:center;min-width:0}
.dpill{--dc:#920000;--dm:#ce8c8c;display:inline-flex;align-items:center;min-width:0;max-width:100%;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.92);overflow:hidden;color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.18);background:linear-gradient(90deg,var(--dc) 0,var(--dc) 46px,var(--dm) 84px,#fff 100%)}
.dpill .dp-ic{flex:none;width:46px;height:100%;display:grid;place-items:center;color:#fff}
.dpill .dp-ic svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.dpill .dp-tx{padding:0 6px 0 38px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpill .dp-lock{display:flex;padding:0 12px 0 4px;color:#4b5260}
.dpill select{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;height:100%;padding:0 10px 0 38px;max-width:300px;text-overflow:ellipsis}
.dpill select option{color:var(--ink);background:#fff}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.who{display:flex;align-items:center;gap:12px;white-space:nowrap}
.who-tx{display:grid;text-align:right;line-height:1.25}
.who-tx strong{font-size:14px}
.who-tx .role-txt{font-size:12.5px;opacity:.92}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);letter-spacing:.02em}
.out{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer;transition:background .15s}
.out:hover{background:rgba(255,255,255,.26)}
.menu-btn{display:none;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer}

/* Estructura */
.shell{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:calc(100vh - var(--header-h))}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:var(--header-h);align-self:start;height:calc(100vh - var(--header-h));overflow:auto}
.side-who{display:none;padding:4px 14px 14px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:4px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;border-left:4px solid transparent}
.nav a:hover{background:#f1f2f4;color:var(--ink)}
.nav a[aria-current=page]{background:var(--muni-tint);color:var(--muni);font-weight:700;border-left-color:var(--muni)}
main{padding:24px 32px 40px;min-width:0;outline:none}
.crumbs{color:var(--muted);margin-bottom:6px}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.foot{margin-top:40px;color:var(--muted);font-size:13px;display:flex;gap:20px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:#fff;text-decoration:none;line-height:1.3}
.btn.primary{background:var(--muni);color:#fff}
.btn.primary:hover{background:var(--muni-dark)}
.btn.soft{background:var(--muni-tint);color:var(--muni)}
.btn.soft:hover{background:#f6d6d6}
.btn.ghost{background:#fff;border-color:#c6ccd4;color:var(--ink)}
.btn.ghost:hover{background:#f1f2f4}
.btn.danger{background:#9b1c1c;color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* Tarjetas, avisos, barra de búsqueda */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px}
.scope{display:flex;gap:10px;align-items:flex-start;background:#eef3fa;border:1px solid #c9d9ee;color:#1b3f6e;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.scope svg{flex:none;margin-top:2px}
.toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:16px 18px;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:240px}
.toolbar label{display:block;color:var(--muted);margin-bottom:5px}
.in{width:100%;border:1px solid #c6ccd4;border-radius:8px;padding:10px 12px;background:#fff}
.in:hover{border-color:#8f98a4}
.in[aria-invalid=true]{border-color:var(--bad);background:#fff8f8}
.in[disabled],.in[readonly]{background:#f1f2f4;color:#3d434d}
textarea.in{resize:vertical;min-height:96px}

/* Tabla */
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th{background:#eceef1;text-align:left;font-weight:700;padding:11px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:hover{background:#fdf5f5}
.acts{display:flex;gap:8px}
.ib{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.ib.v{color:var(--info)}.ib.e{color:var(--warn)}.ib.d{color:var(--bad)}
.ib.v:hover{background:var(--info-bg);border-color:#b9d1ee}
.ib.e:hover{background:var(--warn-bg);border-color:#f0d9a0}
.ib.d:hover{background:var(--bad-bg);border-color:#f1bcbc}
.ib[data-tip]:hover::after,.ib[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#1f2328;color:#fff;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:5}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-off{background:var(--off-bg);color:var(--off)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:0 4px 4px 0;background:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;color:var(--muted)}
.pages{display:flex;gap:6px;flex-wrap:wrap}
.pg{min-width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;padding:0 12px;font-weight:600}
.pg[aria-current=page]{background:var(--muni);border-color:var(--muni);color:#fff}
.pg[disabled]{opacity:.5;cursor:not-allowed}

/* Estados */
.state{background:#fff;border:1px dashed #c6ccd4;border-radius:10px;padding:40px 24px;text-align:center}
.state .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--off-bg);color:var(--off)}
.state.err .ic{background:var(--bad-bg);color:var(--bad)}
.state h2{font-size:18px;margin-bottom:6px}
.state p{color:var(--muted);max-width:52ch;margin:0 auto 16px}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#eceef1 25%,#f7f8fa 37%,#eceef1 63%);background-size:400% 100%;animation:sh 1.2s ease infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

/* Formularios */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.full{grid-column:1/-1}
.fl{display:block;font-weight:600;margin-bottom:6px}
.req{color:var(--muni)}
.err{color:var(--bad);font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.help{color:var(--muted);font-size:13px;margin-top:6px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--muni)}
.formfoot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;flex-wrap:wrap}
.meta{color:var(--muted);margin-top:4px}
.perm{width:100%;border-collapse:collapse;min-width:560px}
.perm th,.perm td{padding:8px 12px;border-top:1px solid var(--line);text-align:center}
.perm th:first-child,.perm td:first-child{text-align:left}
.perm th{background:#eceef1;border-top:0}
.perm input{width:17px;height:17px;accent-color:var(--muni)}

/* Autenticación */
.auth{max-width:460px;margin:36px auto;padding:0 16px}
.auth .card{padding:28px}
.auth h1{margin:6px 0 4px}
.lead{color:var(--muted);margin-bottom:18px}
.subtle{color:var(--muted)}
.stepline{color:var(--muni);font-weight:700;margin:8px 0 6px}
.field{margin-bottom:16px}
.pwrow{position:relative}
.pwrow .in{padding-right:84px}
.pwrow button{position:absolute;right:6px;top:6px;bottom:6px;border:0;background:none;color:var(--muni);font-weight:600;cursor:pointer;border-radius:6px;padding:0 10px}
.demo-box{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.demo-box summary{cursor:pointer;font-weight:600}
.demo-box table{min-width:0;margin-top:10px}
.demo-box td,.demo-box th{padding:6px 8px;font-size:13px}
.code{display:flex;gap:8px;margin:6px 0 10px}
.code input{width:100%;max-width:52px;height:54px;text-align:center;font-size:22px;font-weight:700;border:1px solid #c6ccd4;border-radius:8px}
.code input[aria-invalid=true]{border-color:var(--bad);background:#fff8f8}
.rules{list-style:none;padding:0;margin:8px 0 14px;display:grid;gap:4px}
.rules li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.rules li.ok{color:var(--ok)}

/* Inicio */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:18px 0 26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat strong{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.mcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.mcard:hover{border-color:var(--muni);background:#fffafa}
.mcard .mi{flex:none;width:38px;height:38px;border-radius:8px;background:var(--muni-tint);color:var(--muni);display:grid;place-items:center}
.mcard .mt b{display:block;font-size:15px;color:var(--ink)}
.mcard .mt span{color:var(--muted);font-size:13px}
h2.sec{font-size:18px;margin-top:8px}

/* Avisos estilo SweetAlert2 y notificaciones */
.swal-back{position:fixed;inset:0;background:rgba(20,22,26,.55);display:grid;place-items:center;z-index:300;padding:16px}
.swal{background:#fff;border-radius:14px;width:min(440px,100%);padding:28px 28px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.swal-ico{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;border:3px solid;font-size:30px;font-weight:700}
.swal-ico.success{color:var(--ok);border-color:#bfe3cd;background:var(--ok-bg)}
.swal-ico.error{color:var(--bad);border-color:#f1bcbc;background:var(--bad-bg)}
.swal-ico.warning{color:var(--warn);border-color:#f0d9a0;background:var(--warn-bg)}
.swal-ico.question,.swal-ico.info{color:var(--info);border-color:#b9d1ee;background:var(--info-bg)}
.swal h2{font-size:21px;margin-bottom:8px}
.swal p{color:var(--muted);margin:0 0 20px}
.swal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:320;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#1f2328;color:#fff;padding:10px 16px;border-radius:10px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .16s ease-out}

/* Panel de demostración */
#demo[hidden]{display:none}
.demo-btn{position:fixed;right:16px;bottom:16px;z-index:90;background:#1f2328;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#demoPanel{position:fixed;right:16px;bottom:64px;z-index:90;width:min(320px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.2);display:grid;gap:10px}
#demoPanel[hidden]{display:none}
.demo-note{color:var(--muted);font-size:13px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:var(--header-h);bottom:0;height:auto;width:var(--side-w);transform:translateX(-100%);transition:transform .2s;z-index:25;overflow:auto;box-shadow:6px 0 24px rgba(0,0,0,.12)}
  body.nav-open .side{transform:none}
  .menu-btn{display:inline-flex}
  .side-who{display:block}
  main{padding:18px 16px 40px}
  .grid{grid-template-columns:1fr}
  .top{gap:10px;padding:0 12px}
  .brand{font-size:15px}
  .who-tx,.out-tx{display:none}
  .out{padding:0;width:38px}
  h1{font-size:22px}
}
@media (max-width:560px){ .brand small{display:none} .dpill select,.dpill .dp-tx{max-width:150px;font-size:13px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="demo" hidden>
  <button class="demo-btn" id="demoToggle" aria-expanded="false" aria-controls="demoPanel">Panel de demostración</button>
  <div id="demoPanel" hidden>
    <p class="demo-note">No forma parte del sistema. Sirve para revisar cada perfil durante la presentación.</p>
    <div>
      <label class="fl" for="demoRole">Ver el sistema como</label>
      <select class="in" id="demoRole">
        <option value="superadmin">Superadministrador</option>
        <option value="coordinador">Coordinador</option>
        <option value="delegado">Delegado municipal</option>
        <option value="funcionario">Funcionario</option>
      </select>
    </div>
    <button class="btn ghost" id="demoUrl">Abrir Delegaciones escribiendo la URL</button>
    <button class="btn ghost" id="demoErr">Simular error de carga</button>
    <button class="btn ghost" id="demoSrv">Simular error del servidor al guardar</button>
  </div>
</div>
<noscript>Esta interfaz de referencia necesita JavaScript.</noscript>

 pencil:'<path d="M4 20l1-4L16.5 4.5a2 2 0 013 3L8 19l-4 1z"/><path d="M14 7l3 3"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 out:'<path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/>'
};
function icon(n,s){s=s||18;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(function(i){return parseInt(h.substr(i,2),16)})}
function rgb2hex(a){return '#'+a.map(function(v){return pad(Math.round(v).toString(16))}).join('')}
function lumOf(a){var f=function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};return 0.2126*f(a[0])+0.7152*f(a[1])+0.0722*f(a[2])}
function readable(hex){var a=hex2rgb(hex),n=0;while(1.05/(lumOf(a)+0.05)<4.5&&n<24){a=a.map(function(v){return v*0.94});n++}return rgb2hex(a)}
function mixWhite(hex,p){return rgb2hex(hex2rgb(hex).map(function(v){return v+(255-v)*p}))}
function initials(n){return n.split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join('').toUpperCase()}

  var el=document.createElement('div');el.className='toast';
  el.innerHTML=icon(ic||'check',16)+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);

function swal(o){
  return new Promise(function(res){
    var prev=document.activeElement,icn=o.icon||'info';
    var glyph={success:icon('check',32),error:icon('x',32),warning:icon('alert',32),question:'?',info:'i'}[icn];
    var w=document.createElement('div');w.className='swal-back';
    w.innerHTML='<div class="swal" role="dialog" aria-modal="true" aria-labelledby="swt" aria-describedby="swd"><div class="swal-ico '+icn+'">'+glyph+'</div><h2 id="swt">'+esc(o.title)+'</h2><p id="swd">'+esc(o.text||'')+'</p><div class="swal-btns">'+(o.cancel?'<button class="btn ghost" data-r="0">'+esc(o.cancel)+'</button>':'')+'<button class="btn '+(o.danger?'danger':'primary')+'" data-r="1">'+esc(o.confirm||'Aceptar')+'</button></div></div>';
    document.body.appendChild(w);
    var btns=$$('button',w);
    function done(v){document.removeEventListener('keydown',key,true);w.remove();if(prev&&prev.focus)prev.focus();res(v)}
    function key(e){
      if(e.key==='Escape'){e.preventDefault();done(false)}
      if(e.key==='Tab'){var i=btns.indexOf(document.activeElement);e.preventDefault();btns[(i+(e.shiftKey?-1:1)+btns.length)%btns.length].focus()}
    }
    document.addEventListener('keydown',key,true);
    btns.forEach(function(b){b.addEventListener('click',function(){done(b.getAttribute('data-r')==='1')})});
    (o.danger&&o.cancel?btns[0]:btns[btns.length-1]).focus();
  });
}

var R=null;
function maskEmail(e){var p=e.split('@');return (p[0]||'').charAt(0)+'***@'+(p[1]||'')}
function renderRecover(){
  if(!R)R={step:1,email:'',tries:3,exp:0,resend:0};

function recStep(){
  clearTimers();
  var c=$('#rc');

     '<button class="btn primary block" id="rsend">Enviar código</button><p class="subtle" style="margin:12px 0">Si la cuenta existe, recibirás instrucciones.</p><a href="#/login" id="rback">Volver al inicio de sesión</a>';
    $('#re').focus();
    $('#rsend').addEventListener('click',async function(){
      var i=$('#re'),v=i.value.trim(),er=$('#ree');er.innerHTML='';i.removeAttribute('aria-invalid');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){er.innerHTML='<div class="err">'+icon('alert',16)+'Ingresa un correo válido, por ejemplo nombre@dominio.cl.</div>';i.setAttribute('aria-invalid','true');i.focus();return}
      this.disabled=true;this.textContent='Enviando…';
      await new Promise(function(r){setTimeout(r,REDUCED?0:600)});
      R.email=v;R.step=2;R.tries=3;R.exp=Date.now()+600000;R.resend=Date.now()+45000;recStep();
    });
  }
  if(R.step===2){
    c.innerHTML='<p class="stepline">Paso 2 de 3 | Verificación</p><p class="lead">Si el correo está registrado, enviamos un código de 6 dígitos a <strong>'+esc(maskEmail(R.email))+'</strong>. Revisa también la carpeta de spam.</p>'+
     '<fieldset><legend>Código de verificación</legend><div class="code" id="codeBox">'+[1,2,3,4,5,6].map(function(n){return '<input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito '+n+' de 6">'}).join('')+'</div></fieldset><div id="rce"></div>'+
     '<p class="subtle" id="rinfo" style="margin:8px 0 14px"></p>'+
     '<button class="btn primary block" id="rver">Verificar código</button><button class="btn ghost block" id="rres" style="margin-top:10px" disabled>Reenviar código</button>'+
     '<p class="subtle" style="margin:12px 0">Demostración: el código válido es <strong>123456</strong>.</p><a href="#/login">Volver al inicio de sesión</a>';
    var ins=$$('#codeBox input'),locked=false;
    ins[0].focus();
    ins.forEach(function(inp,i){
      inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus()});
      inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus()}if(e.key==='ArrowLeft'&&ins[i-1]){e.preventDefault();ins[i-1].focus()}if(e.key==='ArrowRight'&&ins[i+1]){e.preventDefault();ins[i+1].focus()}});
      inp.addEventListener('paste',function(e){var cd=e.clipboardData||window.clipboardData;if(!cd)return;var t=(cd.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach(function(ch,j){ins[j].value=ch});(ins[Math.min(t.length,5)]).focus()});
    });
    function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60)}
    function tick(){
      var left=R.exp-Date.now(),rs=R.resend-Date.now();
      var info=$('#rinfo'),res=$('#rres'),ver=$('#rver');if(!info)return;
      if(left<=0){info.innerHTML='El código venció. Solicita uno nuevo.';ver.disabled=true;locked=true}
      else if(R.tries<=0){info.innerHTML='Superaste el máximo de intentos. Solicita un nuevo código.';ver.disabled=true;locked=true}
      else{info.innerHTML='El código vence en <strong>'+fmt(left)+'</strong>. Te quedan '+R.tries+(R.tries===1?' intento.':' intentos.')}
      if(rs>0){res.disabled=true;res.textContent='Reenviar código en '+fmt(rs)}else{res.disabled=false;res.textContent='Reenviar código'}
    }
    tick();S.timers.push(setInterval(tick,1000));
    $('#rver').addEventListener('click',function(){
      var v=ins.map(function(i){return i.value}).join(''),er=$('#rce');er.innerHTML='';
      ins.forEach(function(i){i.removeAttribute('aria-invalid')});
      if(locked)return;
      if(v.length<6){er.innerHTML='<div class="err">'+icon('alert',16)+'Ingresa los 6 dígitos del código.</div>';ins.forEach(function(i){if(!i.value)i.setAttribute('aria-invalid','true')});return}
      if(v==='123456'){R.step=3;recStep();return}
      R.tries--;ins.forEach(function(i){i.setAttribute('aria-invalid','true');i.value=''});ins[0].focus();
      er.innerHTML='<div class="err">'+icon('alert',16)+(R.tries>0?'El código no es correcto. Revisa el correo e inténtalo de nuevo.':'El código no es correcto y no quedan intentos.')+'</div>';
      tick();
    });
    $('#rres').addEventListener('click',function(){
      R.tries=3;R.exp=Date.now()+600000;R.resend=Date.now()+45000;locked=false;$('#rver').disabled=false;$('#rce').innerHTML='';
      ins.forEach(function(i){i.value='';i.removeAttribute('aria-invalid')});ins[0].focus();tick();toast('Enviamos un nuevo código (demostración)','info');
    });
  }
  if(R.step===3){
    var rules=[['8 caracteres como mínimo',function(v){return v.length>=8}],['Una letra mayúscula',function(v){return /[A-ZÁÉÍÓÚÑ]/.test(v)}],['Una letra minúscula',function(v){return /[a-záéíóúñ]/.test(v)}],['Un número',function(v){return /\d/.test(v)}]];
    c.innerHTML='<p class="stepline">Paso 3 de 3 | Nueva clave</p><p class="lead">Elige una contraseña que no hayas usado antes.</p>'+
     '<div class="field"><label class="fl" for="np">Nueva contraseña</label><div class="pwrow"><input class="in" id="np" type="password" autocomplete="new-password"><button type="button" class="tg" data-t="np" aria-pressed="false">Mostrar</button></div></div>'+
     '<ul class="rules" id="rules" aria-live="polite">'+rules.map(function(r){return '<li>'+icon('check',16)+r[0]+'</li>'}).join('')+'</ul>'+
     '<div class="field"><label class="fl" for="np2">Confirmar nueva contraseña</label><div class="pwrow"><input class="in" id="np2" type="password" autocomplete="new-password" aria-describedby="np2e"><button type="button" class="tg" data-t="np2" aria-pressed="false">Mostrar</button></div><div id="np2e"></div></div>'+
     '<button class="btn primary block" id="rsave">Guardar contraseña</button>';
    var np=$('#np'),np2=$('#np2');np.focus();
    $$('.tg').forEach(function(b){b.addEventListener('click',function(){var i=$('#'+b.getAttribute('data-t')),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Ocultar':'Mostrar';b.setAttribute('aria-pressed',h)})});
    function chk(){$$('#rules li').forEach(function(li,i){li.className=rules[i][1](np.value)?'ok':''})}
    np.addEventListener('input',chk);
    $('#rsave').addEventListener('click',async function(){
      var e2=$('#np2e');e2.innerHTML='';np2.removeAttribute('aria-invalid');
      if(!rules.every(function(r){return r[1](np.value)})){np.setAttribute('aria-invalid','true');np.focus();return}
      np.removeAttribute('aria-invalid');
      if(np.value!==np2.value){e2.innerHTML='<div class="err">'+icon('alert',16)+'Las contraseñas no coinciden.</div>';np2.setAttribute('aria-invalid','true');np2.focus();return}
      await swal({icon:'success',title:'Contraseña actualizada',text:'Ya puedes iniciar sesión con tu nueva contraseña.',confirm:'Ir al inicio de sesión'});
      R=null;go('#/login');
    });
  }
}

    }else{
      row.tipo=tipo.value;row.sub=sub.value;row.descripcion=desc.value.trim();row.estado=$('#f_est').value;S.dirty=false;
      await swal({icon:'success',title:'Cambios guardados',text:'La atención '+row.n+' se actualizó y el cambio quedó en la auditoría.',confirm:'Aceptar'});
    }
    go('#/atenciones');
  });
}

/* ---------- Enrutador ---------- */
function route(){
  clearTimers();
  var h=(location.hash||'#/login').replace(/^#\//,'').split('/').map(function(x){try{return decodeURIComponent(x)}catch(e){return x}});
  var view=h[0],act=h[1],id=h[2];
  if(!S.role){
    if(view==='recuperar')return renderRecover();
    if(view!=='login'&&view)history.replaceState(null,'','#/login');
    return renderLogin();
  }
  if(view==='login'||view==='recuperar'||!view){history.replaceState(null,'','#/inicio');return renderHome()}
  if(view==='inicio')return renderHome();
  if(!MOD[view])return renderNotFound();
  if(!canSee(view))return renderDenied(view);
  if(!act)return renderList(view);
  if(act==='nuevo'){if(!can(view,'crear'))return renderDenied(view,'crear');return renderForm(view,'nuevo')}
  if(act==='ver'||act==='editar'){
    if(act==='editar'&&!can(view,'editar'))return renderDenied(view,'editar');
    var M=MOD[view],all=DATA[view].filter(function(x){return String(x[M.idk])===id})[0];
    if(!all)return renderNotFound();
    if(view!=='delegaciones'&&view!=='roles'&&scoped(view).indexOf(all)<0)return renderDenied(view,'alcance');
    return renderForm(view,act,all);
  }
  renderNotFound();
}
window.addEventListener('hashchange',route);

/* ---------- Panel de demostración ---------- */
$('#demoToggle').addEventListener('click',function(){var p=$('#demoPanel');p.hidden=!p.hidden;this.setAttribute('aria-expanded',!p.hidden)});
$('#demoRole').addEventListener('change',function(){S.role=this.value;S.deleg=defaultDeleg(this.value);S.list={};S.forceErr=false;toast('Ahora ves el sistema como '+roleName(actor().rol),'info');go('#/inicio')});
$('#demoUrl').addEventListener('click',function(){go('#/delegaciones')});
$('#demoErr').addEventListener('click',function(){if(!/^#\/(delegaciones|roles|usuarios|items|tipos|subtipos|atenciones)$/.test(location.hash)){toast('Abre un listado para ver el error de carga','info');return}S.forceErr=true;route()});

$('#demoSrv').addEventListener('click',function(){S.forceSave=true;toast('El próximo guardado o eliminación fallará (demostración)','info')});

route();
})();
</script>
