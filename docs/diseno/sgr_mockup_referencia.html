function saveM(){const v=$("f1").value.trim(),t=$("f2").value,d=S.del==ALL?$("f0").value:S.del;$("e1").textContent=v?"":"Ingrese el nombre del solicitante.";$("e2").textContent=t?"":"Seleccione un tipo de atención.";
$("f1").setAttribute("aria-invalid",!v);$("f2").setAttribute("aria-invalid",!t);if(!v||!t){(v?$("f2"):$("f1")).focus();return}
const z=now(),me=U[S.role].n,n="ATN-"+String(A.length+1).padStart(4,"0");A.push({n:n,s:v,rut:$("f6").value.trim()||"Sin RUT",t:t,u:$("f3").value||"—",l:DN.indexOf(d),e:"Ingresada",d:z,r:me,ev:$("f5").files.length>0,h:[[z,"Atención ingresada",me]]});S.pg=1;closeM();rMain();toast("Atención "+n+" registrada en "+d+" (demostración)")}

function ficha(n,mode){const a=A.find(x=>x.n==n),nx=ORD.slice(ORD.indexOf(a.e)+1),form=mode=="e"&&has("Atenciones","e")&&nx.length?'<label>Nuevo estado<select id="fs">'+nx.map(oo).join("")+'</select></label><label>Nota para la bitácora<textarea id="fn"></textarea></label>':"";

$("modal").querySelector("select,button").focus()}
function openF(n,mode){S.modal=true;lastFocus=document.activeElement;S.fn=n;S.fm=mode;ficha(n,mode)}
function updF(){const a=A.find(x=>x.n==S.fn),st=$("fs").value,nt=$("fn").value.trim();a.e=st;hist(a).push([now(),"Cambio de estado: "+st+(nt?" — "+nt:""),U[S.role].n]);ficha(S.fn,S.fm);if(S.view=="home")rMain();else{rFx();rTbl()}toast("Estado actualizado a «"+st+"» (demostración)")}
function csv(){const c=S.csv,q=x=>'"'+String(Array.isArray(x)?x.map(i=>dc(i)+" · "+DN[i]).join("; "):x).replace(/"/g,'""')+'"';return "\ufeff"+[c[0]].concat(c[1]).map(r=>r.map(q).join(";")).join("\r\n")}
function dlCsv(){if(!S.csv||!(inM()||S.view=="a:Atenciones")){toast("Esta pantalla no tiene tabla para exportar");return}
const b=new Blob([csv()],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=ttl(S.csv[2]).replace(/ /g,"_")+".csv";document.body.appendChild(a);a.click();a.remove();toast("Se descargó «"+a.download+"» con "+S.csv[1].length+" registros")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]"),a=b&&b.dataset.a,v=b&&b.dataset.v;
if(S.modal){if(a=="close"||e.target.id=="ov")closeM();else if(a=="save")saveM();else if(a=="fst")updF();return}

if(a=="pg"){S.pg=v=="prev"?S.pg-1:v=="next"?S.pg+1:+v;rTbl();return}

if(a=="ficha"){const x=v.split("|");rTop();openF(x[0],x[1]);return}
if(a=="csv"){dlCsv();return}
if(a=="st"){S.st=v;S.pg=1;rFx();rTbl();return}
if(a=="rm"){if(v=="q"){S.q="";$("q").value=""}else if(v=="st")S.st="";else delete S.f[v];S.pg=1;rFx();rTbl();return}
S.menu="";
if(a=="modal"){rTop();openM();return}
if(a=="toast"){rTop();toast(v);return}
if(a=="del")S.del=v;
if(a=="pin")S.pin=!S.pin;
if(a=="panel")S.pf=!S.pf;
if(a=="go"){reset();if(v=="m")S.panel=!S.panel;else{S.view=v;S.panel=v.slice(0,2)=="m:"}}
render()});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;S.pg=1;rFx();rTbl()}});
document.addEventListener("change",e=>{const t=e.target,k=t.dataset.f;if(t.id=="f2"){$("f3").innerHTML='<option value="">Seleccione</option>'+(SB[t.value]||SU).map(oo).join("");return}if(t.id=="role"){S.role=t.value;S.del=U[S.role].d;S.view="home";S.menu="";S.panel=false;S.pf=true;reset();render()}else if(k){if(k=="st")S.st=t.value;else if(k=="pp")S.pp=t.value;else S.f[k]=t.value;if(k=="t"&&S.f.u&&!(SB[t.value]||SU).includes(S.f.u))delete S.f.u;S.pg=1;rFx();rTbl();const n=document.querySelector('[data-f="'+k+'"]');if(n)n.focus()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){if(S.modal)closeM();else if(S.menu){S.menu="";rTop()}return}
if(e.key=="Tab"&&S.modal){const f=[].slice.call($("modal").querySelectorAll("input,select,textarea,button")),i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i==f.length-1){e.preventDefault();f[0].focus()}}
if(e.key=="Enter"&&S.modal&&e.target.id=="f1"){e.preventDefault();saveM()}});
render();
