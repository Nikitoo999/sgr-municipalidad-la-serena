{% extends "portal/base.html" %}
{% block content %}
<h1>Recuperar contraseña</h1>
<p><strong>Paso 1 de 3 · Solicitar código</strong></p>
<p class="help">Ingresa el correo asociado a tu cuenta.</p>
<form method="post" novalidate>{% csrf_token %}
  <div class="field"><label for="{{ form.email.id_for_label }}">Correo electrónico *</label>{{ form.email }}{{ form.email.errors }}</div>
<button class="btn" type="submit">Enviar código</button>
</form>
<p class="help">Si la cuenta existe, recibirás instrucciones.</p>
<p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
{% endblock %}
