{% extends 'portal/base_auth.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<p class="auth-sub">Gestión de Atención Ciudadana</p>
<h1 class="auth-title">Iniciar sesión</h1>
<p class="auth-lead">Accede con tu cuenta institucional.</p>

<form method="post" novalidate id="loginForm">
  {% csrf_token %}
  <div class="field">
    <label class="fl" for="id_username">Usuario o correo</label>
    <input class="in" type="text" name="username" id="id_username"
            autocomplete="username" required
            aria-describedby="username-error">
    <div id="username-error" class="err-slot" aria-live="polite"></div>
  </div>

  <div class="field">
    <label class="fl" for="id_password">Contraseña</label>
    <div class="pwrow">
      <input class="in" type="password" name="password" id="id_password"
              autocomplete="current-password" required
              aria-describedby="password-error">
      <button type="button" id="togglePw" aria-pressed="false">Mostrar</button>
    </div>
    <div id="password-error" class="err-slot" aria-live="polite"></div>
  </div>

  <input type="hidden" name="next" value="{{ next }}">

  <button class="btn primary block" type="submit" id="loginBtn">Ingresar</button>
</form>

<p class="auth-links">
  <a href="{% url 'password_reset_request' %}">¿Olvidaste tu contraseña?</a>
</p>
{% endblock %}
