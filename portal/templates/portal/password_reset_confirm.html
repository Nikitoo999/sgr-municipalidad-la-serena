{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGR La Serena — Recuperar contraseña</title>
    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
</head>
<body>
    <main class="card">
        <h1>SGR Municipalidad de La Serena</h1>
        {% if validlink %}
        <p class="subtitle">Escriba su nueva contraseña.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="background-color: #C62828;">Cambiar contraseña</button>
        </form>
        {% else %}
        <p>El enlace de recuperación no es válido o ya venció.</p>
        <p class="subtitle"><a href="{% url 'password_reset' %}">Solicitar un enlace nuevo</a></p>
        {% endif %}
    </main>
</body>
</html>
