{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGR La Serena — Recuperar contraseña</title>
    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
</head>
<body>
    <main class="card">
        <h1>SGR Municipalidad de La Serena</h1>
        <p class="subtitle">Ingrese el correo asociado a su usuario y le enviaremos un enlace para crear una nueva contraseña.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn" style="background-color: #C62828;">Enviar enlace</button>
        </form>
        <p class="subtitle"><a href="{% url 'login' %}">Volver a ingresar</a></p>
    </main>
</body>
</html>
